<!DOCTYPE html>
<html>
<head>

    <title>Request Access</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/doctor.css') }}">

</head>
<body>

<div class="container">

    <h2>Request Patient Access</h2>

    <form method="POST">

        <label>Citizen ID</label>

        <input
        type="number"
        name="citizen_id"
        required>

        <br><br>

        <label>Requested Scope</label>

        <select name="requested_scope">

            <option value="full_record">Full Medical Record</option>

            <option value="history">History & Conditions Only</option>

            <option value="prescriptions">Prescriptions Only</option>

        </select>

        <br><br>

        <button type="submit">

            Send Request

        </button>

    </form>

</div>

</body>
</html>
