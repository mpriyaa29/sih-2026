<!DOCTYPE html>
<html>
<head>

    <title>Doctor Dashboard</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/doctor.css') }}">

</head>

<body>
<div class="dashboard-page">

    <div class="top-bar">

        <div>
            <h2>LifeLink</h2>
            <p>Doctor Access Portal</p>
        </div>

        <div class="doctor-profile">
            <h3>Dr. Kumar</h3>
            <span>Emergency Physician</span>
        </div>

    </div>

    <div class="stats-row">

        <div class="stat-box">
            <h2>24</h2>
            <p>Total Requests</p>
        </div>

        <div class="stat-box">
            <h2>18</h2>
            <p>Approved</p>
        </div>

        <div class="stat-box">
            <h2>3</h2>
            <p>Denied</p>
        </div>

        <div class="stat-box">
            <h2>98%</h2>
            <p>Success Rate</p>
        </div>

    </div>

    <div class="action-grid">

        <a href="/request-access">Request Access</a>

        <a href="/login">
    Emergency Access
</a>

        <a href="/updatedrecords">Update Record</a>

        <a href="/upload-prescription">Upload Prescription</a>

        <a href="/my-requests">My Requests</a>

        <a href="/logs">Audit Logs</a>

    </div>

</div>

<style>.dashboard-page{
    width:90%;
    max-width:1400px;
    margin:auto;
    padding:40px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
}

.top-bar h2{
    color:#3b82f6;
    margin:0;
    font-size:36px;
}

.top-bar p{
    color:#94a3b8;
}

.doctor-profile{
    text-align:right;
    color:white;
}

.stats-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:40px;
}

.stat-box{
    background:#0d214f;
    border-radius:16px;
    padding:25px;
    text-align:center;
}

.stat-box h2{
    color:#3b82f6;
    font-size:36px;
    margin:0;
}

.action-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.action-grid a{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:22px;
    text-align:center;
    border-radius:14px;
    font-weight:600;
    transition:.3s;
}

.action-grid a:hover{
    transform:translateY(-4px);
    background:#3b82f6;
}

</style>
</body>
</html>
