<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor HPR Login - BioLink AYUSH Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            background-color: #050811;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .pill-btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 0.5rem;
            padding: 0.5rem 1.2rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .pill-btn-outline:hover {
            background-color: #ffffff;
            color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- TOP NAVIGATION -->
    <header class="glass-header sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-2xl font-extrabold text-white tracking-tighter">
                <span class="w-8 h-8 rounded-lg bg-black/40 border border-white/20 flex items-center justify-center text-xs text-white">
                    <i class="fa-solid fa-dna text-slate-200"></i>
                </span>
                <span>BioLink<span class="font-normal text-slate-300 ml-1">AYUSH</span></span>
            </a>
            <a href="/" class="pill-btn-outline text-xs">
                <i class="fa-solid fa-arrow-left mr-1"></i> Return Home
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 py-12 w-full my-auto">
        <div class="glass-card rounded-3xl p-8 sm:p-10 space-y-6 w-full">
            
            <!-- Header -->
            <div class="space-y-2 border-b border-white/10 pb-6 text-center">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/20 text-slate-200 text-xs font-semibold">
                    <i class="fa-solid fa-user-doctor"></i> Mode 03: Doctor & Staff Portal
                </div>
                <h2 class="text-3xl font-normal tracking-tight text-white">Doctor HPR Login</h2>
                <p class="text-slate-300 text-xs leading-relaxed font-light">Healthcare Professional Registry (HPR) Authentication</p>
            </div>

            {% if error %}
            <div class="p-3.5 bg-rose-950/80 border border-rose-600 text-rose-200 text-xs font-semibold rounded-xl text-center">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        Doctor HPR ID / Employee ID
                    </label>
                    <input type="text" name="hpr_id" value="HPR-DOC001" placeholder="e.g. HPR-DOC001 or DOC001" required
                        class="w-full p-4 bg-slate-950/80 border border-white/20 rounded-xl text-white font-mono text-sm focus:outline-none focus:border-white">
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        Password
                    </label>
                    <input type="password" name="password" value="Doctor@123" placeholder="Enter password" required
                        class="w-full p-4 bg-slate-950/80 border border-white/20 rounded-xl text-white text-sm focus:outline-none focus:border-white">
                </div>

                <button type="submit" class="w-full py-4 bg-white hover:bg-slate-200 text-slate-950 font-semibold rounded-xl transition-all flex items-center justify-center gap-2 text-sm shadow-xl">
                    <i class="fa-solid fa-right-to-bracket text-slate-950"></i>
                    <span>Login to HPR Doctor Portal</span>
                </button>
            </form>

            <div class="text-center pt-2">
                <a href="/hospital-workspace" class="text-xs text-slate-400 hover:text-white transition">
                    ← Back to Hospital Workspace Hub
                </a>
            </div>

        </div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 border-t border-white/10">
        © BioLink AYUSH Digital Kiosk Infrastructure
    </footer>
</body>
</html>
