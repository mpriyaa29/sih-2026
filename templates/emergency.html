<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Emergency Access</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body
style="
background:#081229;
min-height:100vh;
padding:40px;
font-family:sans-serif;
color:white;
">

    <h1
    style="
    text-align:center;
    margin-bottom:40px;
    font-size:42px;
    color:#2563eb;
    ">
        Emergency Access
    </h1>

    <form
    method="POST"

    style="
    max-width:600px;
    margin:auto;
    display:flex;
    gap:15px;
    margin-bottom:50px;
    ">

        <input
        type="text"
        name="search"
        placeholder="Enter Citizen Name"

        style="
        flex:1;
        padding:16px;
        border:none;
        border-radius:12px;
        background:#1e293b;
        color:white;
        font-size:16px;
        ">

        <button
        type="submit"

        style="
        background:#2563eb;
        color:white;
        border:none;
        padding:16px 24px;
        border-radius:12px;
        cursor:pointer;
        font-size:16px;
        ">

            Search

        </button>

    </form>

    {% if citizen %}

    <div
    style="
    max-width:900px;
    margin:auto;
    background:#1e293b;
    border-radius:24px;
    overflow:hidden;
    border:1px solid #334155;
    ">

        <img
        src="{{ url_for('static',
        filename='uploads/' + citizen.face_image) }}"

        style="
        width:100%;
        height:400px;
        object-fit:cover;
        ">

        <div style="padding:35px;">

            <h2
            style="
            font-size:36px;
            margin-bottom:25px;
            color:#22c55e;
            ">
                {{ citizen.fullname }}
            </h2>

            <div
            style="
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            ">

                <p><b>Age:</b> {{ citizen.age }}</p>

                <p><b>Gender:</b> {{ citizen.gender }}</p>

                <p><b>Blood Group:</b> {{ citizen.blood_group }}</p>

                <p><b>Allergies:</b> {{ citizen.allergies }}</p>

                <p><b>Diseases:</b> {{ citizen.diseases }}</p>

                <p>
                    <b>Emergency Contact:</b>
                    {{ citizen.emergency_contact }}
                </p>

            </div>

        </div>

    </div>

    {% endif %}

</body>
</html>
