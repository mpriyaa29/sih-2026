<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allotment of Doctors & Appointment Scheduling - LifeLink</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        body { background-color: #060913; }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-100 p-6">
    <div class="glass-card max-w-4xl mx-auto rounded-3xl p-8 my-8 space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center pb-4 border-b border-slate-800">
            <div>
                <h2 class="text-2xl font-extrabold text-blue-400 flex items-center gap-3">
                    <i class="fa-solid fa-user-doctor"></i> Doctor Allotment & Appointment Scheduling
                </h2>
                <p class="text-slate-400 text-sm mt-1">
                    Patient: <strong class="text-white">{{ citizen.fullname }}</strong> &nbsp;|&nbsp; Case #{{ case.id }} &nbsp;|&nbsp; Severity: 
                    {% if case.priority == 'urgent' %}
                        <span class="px-2.5 py-0.5 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full font-bold text-xs">URGENT</span>
                    {% elif case.priority == 'review_required' %}
                        <span class="px-2.5 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-full font-bold text-xs">REVIEW REQUIRED</span>
                    {% else %}
                        <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full font-bold text-xs">ROUTINE</span>
                    {% endif %}
                </p>
            </div>
            <a href="javascript:history.back()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
        </div>

        <form method="POST" class="space-y-6">
            
            <!-- Doctor Roster Selection -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-200">
                    <i class="fa-solid fa-user-check text-blue-400 mr-1.5"></i> Select & Allot Practitioner
                </label>
                <select name="doctor_id" required
                    class="w-full p-3.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    {% for doc in doctors %}
                        <option value="{{ doc.id }}">
                            {{ doc.name }} ({{ doc.designation }}) - ID: {{ doc.doctor_id }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Date & Status -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-200">
                        <i class="fa-regular fa-calendar-days text-blue-400 mr-1.5"></i> Appointment Date & Time
                    </label>
                    <input type="datetime-local" name="appointment_date" required id="app_date"
                        class="w-full p-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-200">
                        <i class="fa-solid fa-tag text-blue-400 mr-1.5"></i> Appointment Status
                    </label>
                    <select name="status" class="w-full p-3 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white focus:outline-none focus:border-blue-500">
                        <option value="Scheduled">Scheduled (Active)</option>
                        <option value="Urgent Allotment">Urgent Emergency Allotment</option>
                    </select>
                </div>
            </div>

            <!-- Special Instructions -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-200">
                    <i class="fa-solid fa-pen text-blue-400 mr-1.5"></i> Special Instructions / Notes
                </label>
                <textarea name="notes" rows="3" placeholder="Enter clinical instructions for allotted doctor..."
                    class="w-full p-3.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-base">
                <i class="fa-solid fa-calendar-check"></i> Confirm Allotment & Save Appointment
            </button>
        </form>
    </div>

    <script>
        var now = new Date();
        now.setHours(now.getHours() + 1);
        now.setMinutes(0);
        var iso = now.toISOString().slice(0, 16);
        document.getElementById('app_date').value = iso;
    </script>
</body>
</html>
