<!DOCTYPE html>
<html>
<head>

    <title>Doctor Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/doctor.css') }}">

</head>

<body>

<div class="container">

    <h2>Doctor Login</h2>

    <form method="POST">

        <div class="form-group">

            <label>Doctor ID</label>

            <input
            type="text"
            name="doctor_id"
            required>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
            type="password"
            name="password"
            required>

        </div>

        <button type="submit">

            Login

        </button>

    </form>

</div>

</body>
</html>
